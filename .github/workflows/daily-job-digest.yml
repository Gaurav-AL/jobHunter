name: Daily JobHunter email

on:
  schedule:
    - cron: '30 12 * * *' # 18:00 Asia/Kolkata (daily)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-job-digest
  cancel-in-progress: false

jobs:
  email-matches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch recent resume-matched roles and email the digest
        env:
          JOB_EMAIL_TO: gauravchaudhary.hck@gmail.com
          JOBHUNTER_DASHBOARD_URL: ${{ secrets.JOBHUNTER_DASHBOARD_URL }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          JOBVETTA_API_KEY: ${{ secrets.JOBVETTA_API_KEY }}
        run: python scripts/daily_job_digest.py
