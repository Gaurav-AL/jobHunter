name: Daily JobHunter email

on:
  schedule:
    - cron: '17 3 * * *' # 08:47 Asia/Kolkata (daily); offset avoids top-of-hour queueing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-job-digest
  cancel-in-progress: false

jobs:
  email-matches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch recent resume-matched roles and email the digest
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_COUNTRY: in
          JOB_LOCATION: India
          JOB_EMAIL_TO: gauravchaudhary.hck@gmail.com
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python scripts/daily_job_digest.py
